<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="100percent stacked bar"><title>100percent stacked bar</title><desc>Three mutually exclusive illustrative categories:A45%,B30%,C25%.Sum100%.</desc><g font-family="Arial,sans-serif" font-size="20" fill="#123F43"><rect x="160" y="145" width="252.0" height="90" fill="#123F43" stroke="#F7F5EF" stroke-width="2"/><text x="286.0" y="125" text-anchor="middle">45%</text><rect x="412.0" y="145" width="168.0" height="90" fill="#315F86" stroke="#F7F5EF" stroke-width="2"/><text x="496.0" y="125" text-anchor="middle">30%</text><rect x="580.0" y="145" width="140.0" height="90" fill="#A65332" stroke="#F7F5EF" stroke-width="2"/><text x="650.0" y="125" text-anchor="middle">25%</text><rect x="160" y="290" width="20" height="20" fill="#123F43"/><text x="190" y="307" >A / 45%</text><rect x="345" y="290" width="20" height="20" fill="#315F86"/><text x="375" y="307" >B / 30%</text><rect x="530" y="290" width="20" height="20" fill="#A65332"/><text x="560" y="307" >C / 25%</text><text x="160" y="380" >Illustrative whole /45+30+25=100%</text></g></svg>